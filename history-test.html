<!-- 🚧 Coming Soon ＆ 写真2枚上下密着表示エリア -->
<div style="text-align: center; margin: 40px 0;">
    
    <!-- 1. Coming Soon テキスト表示 -->
    <h3 style="font-size: 1.8rem; color: #8b0000; font-weight: bold; margin-bottom: 25px; letter-spacing: 2px;">
        Coming Soon
    </h3>

    <!-- 2. 画像コンテナ（上下の隙間を排除） -->
    <div style="max-width: 600px; margin: 0 auto; line-height: 0; background: #000;">
        <!-- 上段：Faces1.JPEG -->
        <img src="Faces1.JPEG" 
             alt="Faces 1" 
             style="width: 100%; height: auto; display: block; margin: 0; padding: 0; border: none;"
             onerror="this.src='Faces1.jpeg'; this.onerror=function(){this.src='Faces1.jpg';};">
        
        <!-- 下段：Faces2.JPEG（隙間なく密着） -->
        <img src="Faces2.JPEG" 
             alt="Faces 2" 
             style="width: 100%; height: auto; display: block; margin: 0; padding: 0; border: none;"
             onerror="this.src='Faces2.jpeg'; this.onerror=function(){this.src='Faces2.jpg';};">
    </div>

</div>
