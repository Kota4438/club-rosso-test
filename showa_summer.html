<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>昭和の夏の想い出｜Summer Memories of the Showa Era</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            padding: 20px;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fdfbf7;
        }
        h1 {
            color: #d2691e;
            border-bottom: 3px solid #d2691e;
            padding-bottom: 10px;
            text-align: center;
            margin-bottom: 40px;
        }
        .summer-section {
            background: #fff;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .summer-section h2 {
            color: #444;
            border-left: 5px solid #f4a460;
            padding-left: 10px;
            margin-top: 0;
        }
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
        }
        .photo-item {
            text-align: center;
            max-width: 450px;
        }
        .photo-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .photo-caption {
            font-size: 0.9em;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>昭和の夏の想い出<br><span style="font-size: 0.6em; color: #555;">Summer Memories of the Showa Era</span></h1>

    <!-- 庭先と歩み板 -->
    <div class="summer-section">
        <h2>庭先でのひととき</h2>
        <div class="photo-grid">
            <div class="photo-item">
                <img src="ここに画像ファイル名１.jpg" alt="庭先での思い出">
                <p class="photo-caption">夏の庭先での一コマ（カラーとモノクロ）</p>
            </div>
            <div class="photo-item">
                <img src="ここに画像ファイル名５.jpg" alt="車のなかで笑顔">
                <p class="photo-caption">車内（フロリアン）での満面の笑顔！</p>
            </div>
        </div>
    </div>

    <!-- 花火と水遊び -->
    <div class="summer-section">
        <h2>花火とプール</h2>
        <div class="photo-grid">
            <div class="photo-item">
                <img src="ここに画像ファイル名２.jpg" alt="線香花火">
                <p class="photo-caption">夜の暗闇に輝く線香花火</p>
            </div>
            <div class="photo-item">
                <img src="ここに画像ファイル名４.jpg" alt="縁側での花火">
                <p class="photo-caption">夏の夜、縁側での花火あそび</p>
            </div>
            <div class="photo-item">
                <img src="ここに画像ファイル名６.jpg" alt="ビニールプール">
                <p class="photo-caption">お庭のビニールプールで大はしゃぎ！</p>
            </div>
        </div>
    </div>

    <!-- お誕生日 -->
    <div class="summer-section">
        <h2>夏の誕生日・お祝い</h2>
        <div class="photo-grid">
            <div class="photo-item">
                <img src="ここに画像ファイル名７.jpg" alt="誕生日の思い出">
                <p class="photo-caption">みんなでお祝いした誕生日のアルバム写真</p>
            </div>
        </div>
    </div>

    <!-- お出かけ・旅行・遊び -->
    <div class="summer-section">
        <h2>お出かけと冒険の夏</h2>
        <div class="photo-grid">
            <div class="photo-item">
                <img src="ここに画像ファイル名８.jpg" alt="売店でのひととき">
                <p class="photo-caption">懐かしい売店・コカ・コーラのベンチにて</p>
            </div>
            <div class="photo-item">
                <img src="ここに画像ファイル名９.jpg" alt="見晴らしの良い丘でのジャンプ">
                <p class="photo-caption">高台のモニュメントで元気よくジャンプ！</p>
            </div>
            <div class="photo-item">
                <img src="ここに画像ファイル名１０.jpg" alt="木刀でチャンバラ">
                <p class="photo-caption">真剣勝負？木刀でのチャンバラごっこ</p>
            </div>
            <div class="photo-item">
                <img src="ここに画像ファイル名１１.jpg" alt="潜水艦の前で家族写真">
                <p class="photo-caption">大きな潜水艦（561）を背景に家族で記念撮影</p>
            </div>
        </div>
    </div>

</body>
</html>
